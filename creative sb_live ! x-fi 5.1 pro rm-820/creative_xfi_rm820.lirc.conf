#
# brand: Creative
# model no. of remote control: RM-820 It works for me on lirc 0.9.0 with the following parameters:
#--device=hw:Pro --driver=alsa_usb
# devices being controlled by this remote: SB1095 Soundblaster X-Fi USB
Receiver
#

begin remote

name Creative_RM-820
bits 8

begin codes

'POWER' 0x29 # Power
'MENU' 0x1B # Menu
'KNOB_MUTE' 0x0D # Knob Mute
'KNOB_VOLUMEUP' 0x10 # Knob Vol_Up
'KNOB_VOLUMEDOWN' 0x0F # Knob Vol_Down
'MUTE' 0x2A # Mute
'VOLUMEUP' 0x2B # Vol_Up
'VOLUMEDOWN' 0x2C # Vol_Down
'UP' 0x31 # Up
'LEFT' 0x27 # Left
'RIGHT' 0x28 # Right
'REW' 0x35 # Rew
'OK' 0x30 # Ok
'FWD' 0x36 # Fwd
'DOWN' 0x32 # Down
'REPEAT' 0x3C # Repeat
'SHUFFLE' 0x3B # Shuffle
'RETURN' 0x1A # Return
'PLAY' 0x2F # Play

end codes

end remote
